<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question ❤️</title>
<style>
   body {
     margin: 0;
     padding: 0;
     text-align: center;
     font-family: Arial, sans-serif;
     background: linear-gradient(135deg, #ff9a9e, #fad0c4);
     overflow: hidden;
   }
   h1 {
     margin-top: 100px;
     font-size: 28px;
     color: #fff;
     padding: 0 20px;
   }
   .buttons {
     margin-top: 40px;
   }
   button {
     padding: 15px 30px;
     font-size: 18px;
     border: none;
     border-radius: 8px;
     margin: 15px;
     cursor: pointer;
     transition: 0.2s;
   }
   #yesBtn {
     background-color: #ff4d6d;
     color: white;
   }
   #noBtn {
     background-color: white;
     position: absolute;
   }
   .result {
     margin-top: 80px;
     color: white;
     padding: 0 20px;
   }
   img {
     width: 250px;
     margin-top: 20px;
     border-radius: 10px;
   }
</style>
</head>
<body>
<h1>Will you be my special person? ❤️</h1>
<div class="buttons">
<button id="yesBtn" onclick="showLove()">Yes 🥰</button>
<button id="noBtn" onmouseover="moveButton()">No 💔</button>
</div>
<script>
   function moveButton() {
     const button = document.getElementById("noBtn");
     const x = Math.random() * (window.innerWidth - 100);
     const y = Math.random() * (window.innerHeight - 50);
     button.style.left = x + "px";
     button.style.top = y + "px";
   }
   function showLove() {
     document.body.innerHTML = `
<div class="result">
<h1>Oh wow 😍❤️</h1>
<p>You just made my day!</p>
<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
</div>
     `;
   }
</script>
</body>
</html>
