<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Question ❤️</title>

<style>
   body {
     margin: 0;
     padding: 0;
     text-align: center;
     font-family: Arial, sans-serif;
     background: linear-gradient(135deg, #ff9a9e, #fad0c4);
     overflow: hidden;
   }

   h1 {
     margin-top: 100px;
     font-size: 28px;
     color: #fff;
     padding: 0 20px;
   }

   .buttons {
     margin-top: 40px;
   }

   button {
     padding: 15px 30px;
     font-size: 18px;
     border: none;
     border-radius: 8px;
     margin: 15px;
     cursor: pointer;
     transition: all 0.3s ease;
   }

   #yesBtn {
     background-color: #ff4d6d;
     color: white;
   }

   #noBtn {
     background-color: white;
     position: absolute;
   }

   /* Blinking animation */
   .blink {
     animation: blinkAnim 0.5s infinite;
   }

   @keyframes blinkAnim {
     0% { opacity: 1; }
     50% { opacity: 0.3; }
     100% { opacity: 1; }
   }

   .result {
     margin-top: 80px;
     color: white;
     padding: 0 20px;
     animation: fadeIn 1s ease forwards;
   }

   img {
     width: 250px;
     margin-top: 20px;
     border-radius: 10px;
   }

   @keyframes fadeIn {
     from { opacity: 0; transform: scale(0.8); }
     to { opacity: 1; transform: scale(1); }
   }
</style>
</head>

<body>

<h1>Will you be my special person? ❤️</h1>

<div class="buttons">
<button id="yesBtn">Yes 🥰</button>
<button id="noBtn">No 💔</button>
</div>

<script>
   const noBtn = document.getElementById("noBtn");
   const yesBtn = document.getElementById("yesBtn");

   let yesSize = 18;
   const maxSize = 60;
   let maxReached = false;

   function moveButton() {
     const maxX = window.innerWidth - noBtn.offsetWidth;
     const maxY = window.innerHeight - noBtn.offsetHeight;

     const x = Math.random() * maxX;
     const y = Math.random() * maxY;

     noBtn.style.left = x + "px";
     noBtn.style.top = y + "px";

     // Grow YES button until limit
     if (yesSize < maxSize) {
       yesSize += 4;
       yesBtn.style.fontSize = yesSize + "px";

       // Vibrate slightly while chasing
       if (navigator.vibrate) {
         navigator.vibrate(50);
       }
     } else if (!maxReached) {
       // Start blinking once limit reached
       yesBtn.classList.add("blink");
       maxReached = true;
     }
   }

   noBtn.addEventListener("mouseover", moveButton);
   noBtn.addEventListener("touchstart", moveButton);

   yesBtn.addEventListener("click", showLove);

   function showLove() {

     // Romantic vibration pattern: buz buz buz buzzz
     if (navigator.vibrate) {
       navigator.vibrate([200, 100, 200, 100, 200, 100, 600]);
     }

     document.body.innerHTML = `
       <div class="result">
         <h1>Oh wow 😍❤️</h1>
         <p>You just made my day!</p>
         <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
       </div>
     `;
   }
</script>

</body>
</html>
